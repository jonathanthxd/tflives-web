name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prisma generate only needs a syntactically valid URL. Runtime/database
      # integration tests should use a dedicated Neon preview/test database.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
      BETTER_AUTH_SECRET: "ci-placeholder-secret-change-me-1234567890"
      BETTER_AUTH_URL: "http://localhost:3000"
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prisma generate
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
